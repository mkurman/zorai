<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050810" />
    <title>Zorai</title>
    <style>
      /* ── Zorai boot splash ───────────────────────────────────────────────
         Shown before the React bundle loads; faded out by main.tsx once
         hydration completes. Pure CSS so it renders instantly. */
      html, body { margin: 0; padding: 0; height: 100%; background: #05070b; }

      #zorai-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        background:
          radial-gradient(1200px 600px at 50% -10%, rgba(119, 216, 197, 0.09), transparent 60%),
          radial-gradient(900px 500px at 50% 110%, rgba(88, 130, 247, 0.08), transparent 60%),
          linear-gradient(180deg, var(--bg-void) 0%, var(--bg-void) 100%);
        color: #d9e2ef;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        user-select: none;
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      #zorai-boot.zorai-boot--done {
        opacity: 0;
        pointer-events: none;
      }

      /* Ambient animated orbs behind the logo */
      #zorai-boot .zorai-boot-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.5;
        animation: zorai-boot-drift 9s ease-in-out infinite alternate;
      }
      #zorai-boot .zorai-boot-orb--a {
        width: 340px; height: 340px;
        background: var(--zorai-accent-dim);
        top: 18%; left: 30%;
      }
      #zorai-boot .zorai-boot-orb--b {
        width: 300px; height: 300px;
        background: var(--zorai-accent-dim);
        bottom: 16%; right: 28%;
        animation-delay: -4.5s;
      }
      @keyframes zorai-boot-drift {
        from { transform: translate3d(-24px, -18px, 0) scale(1); }
        to   { transform: translate3d(24px, 18px, 0) scale(1.08); }
      }

      #zorai-boot .zorai-boot-logo-wrap {
        position: relative;
        width: 128px;
        height: 128px;
        display: grid;
        place-items: center;
        margin-bottom: 26px;
      }
      #zorai-boot .zorai-boot-mark {
        width: 112px;
        height: 112px;
        overflow: visible;
      }
      #zorai-boot .zorai-boot-mark__line {
        fill: none;
        stroke: #fff;
        stroke-width: 3.15;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: zorai-boot-draw 2.8s cubic-bezier(0.45, 0.02, 0.2, 1) forwards;
      }
      #zorai-boot .zorai-boot-mark__line:nth-child(1) { animation-delay: 0.05s; }
      #zorai-boot .zorai-boot-mark__line:nth-child(2) { animation-delay: 0.28s; }
      #zorai-boot .zorai-boot-mark__line:nth-child(3) { animation-delay: 0.4s; }
      #zorai-boot .zorai-boot-mark__line:nth-child(4) { animation-delay: 0.52s; }
      #zorai-boot .zorai-boot-mark__line:nth-child(5) { animation-delay: 0.64s; }
      #zorai-boot .zorai-boot-mark__line:nth-child(6) { animation-delay: 0.76s; }
      #zorai-boot .zorai-boot-mark__line:nth-child(7) { animation-delay: 0.88s; }
      #zorai-boot .zorai-boot-mark__line:nth-child(8) { animation-delay: 1.08s; }
      #zorai-boot .zorai-boot-mark__line:nth-child(9) { animation-delay: 1.16s; }
      #zorai-boot .zorai-boot-mark__line:nth-child(10) { animation-delay: 1.24s; }
      #zorai-boot .zorai-boot-mark__line:nth-child(11) { animation-delay: 1.32s; }
      #zorai-boot .zorai-boot-mark__line:nth-child(12) { animation-delay: 1.4s; }
      #zorai-boot .zorai-boot-mark__line:nth-child(13) { animation-delay: 1.48s; }
      @keyframes zorai-boot-draw {
        to { stroke-dashoffset: 0; }
      }

      /* Brand wordmark */
      #zorai-boot .zorai-boot-word {
        font-size: 34px;
        letter-spacing: 0.32em;
        text-indent: 0.32em; /* keeps letters optically centered with tracking */
        /* text-transform: uppercase; */
        background: #d9e2ef;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #zorai-boot .zorai-boot-tagline {
        margin-top: 10px;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      /* Loading bar */
      #zorai-boot .zorai-boot-bar {
        margin-top: 34px;
        width: 220px;
        height: 3px;
        border-radius: 999px;
        background: var(--border);
        overflow: hidden;
      }
      #zorai-boot .zorai-boot-bar-fill {
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
        animation: zorai-boot-slide 1.4s ease-in-out infinite;
      }
      @keyframes zorai-boot-slide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(300%); }
      }

      #zorai-boot .zorai-boot-status {
        margin-top: 14px;
        min-height: 16px;
        font-size: 12px;
        color: var(--text-secondary);
        transition: opacity 0.2s ease;
      }

      @media (prefers-reduced-motion: reduce) {
        #zorai-boot .zorai-boot-orb,
        #zorai-boot .zorai-boot-mark__line,
        #zorai-boot .zorai-boot-bar-fill { animation: none; }
        #zorai-boot .zorai-boot-mark__line { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="zorai-boot" aria-hidden="true">
      <div class="zorai-boot-orb zorai-boot-orb--a"></div>
      <div class="zorai-boot-orb zorai-boot-orb--b"></div>
      <div class="zorai-boot-logo-wrap">
        <svg class="zorai-boot-mark" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="zorai-boot-mark__line" cx="50" cy="50" r="42.86" pathLength="1" />
          <path class="zorai-boot-mark__line" pathLength="1" d="M 50 45.82 A 37.67 37.67 0 0 1 50 11.32 A 37.67 37.67 0 0 1 50 45.82" />
          <path class="zorai-boot-mark__line" pathLength="1" d="M 50 45.82 A 37.67 37.67 0 0 1 50 11.32 A 37.67 37.67 0 0 1 50 45.82" transform="rotate(60 50 50)" />
          <path class="zorai-boot-mark__line" pathLength="1" d="M 50 45.82 A 37.67 37.67 0 0 1 50 11.32 A 37.67 37.67 0 0 1 50 45.82" transform="rotate(120 50 50)" />
          <path class="zorai-boot-mark__line" pathLength="1" d="M 50 45.82 A 37.67 37.67 0 0 1 50 11.32 A 37.67 37.67 0 0 1 50 45.82" transform="rotate(180 50 50)" />
          <path class="zorai-boot-mark__line" pathLength="1" d="M 50 45.82 A 37.67 37.67 0 0 1 50 11.32 A 37.67 37.67 0 0 1 50 45.82" transform="rotate(240 50 50)" />
          <path class="zorai-boot-mark__line" pathLength="1" d="M 50 45.82 A 37.67 37.67 0 0 1 50 11.32 A 37.67 37.67 0 0 1 50 45.82" transform="rotate(300 50 50)" />
          <path class="zorai-boot-mark__line" pathLength="1" d="M 69.34 50 L 77.69 44.27 A 28.28 28.28 0 0 1 77.69 55.73 Z" />
          <path class="zorai-boot-mark__line" pathLength="1" d="M 69.34 50 L 77.69 44.27 A 28.28 28.28 0 0 1 77.69 55.73 Z" transform="rotate(60 50 50)" />
          <path class="zorai-boot-mark__line" pathLength="1" d="M 69.34 50 L 77.69 44.27 A 28.28 28.28 0 0 1 77.69 55.73 Z" transform="rotate(120 50 50)" />
          <path class="zorai-boot-mark__line" pathLength="1" d="M 69.34 50 L 77.69 44.27 A 28.28 28.28 0 0 1 77.69 55.73 Z" transform="rotate(180 50 50)" />
          <path class="zorai-boot-mark__line" pathLength="1" d="M 69.34 50 L 77.69 44.27 A 28.28 28.28 0 0 1 77.69 55.73 Z" transform="rotate(240 50 50)" />
          <path class="zorai-boot-mark__line" pathLength="1" d="M 69.34 50 L 77.69 44.27 A 28.28 28.28 0 0 1 77.69 55.73 Z" transform="rotate(300 50 50)" />
        </svg>
      </div>
      <div class="zorai-boot-word">Zorai</div>
      <div class="zorai-boot-tagline">Daemon-first agentic runtime</div>
      <div class="zorai-boot-bar"><div class="zorai-boot-bar-fill"></div></div>
      <div class="zorai-boot-status" id="zorai-boot-status">Starting Zorai…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
