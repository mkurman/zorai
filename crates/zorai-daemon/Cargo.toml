[package]
name = "zorai-daemon"
version.workspace = true
edition.workspace = true

[features]
default = ["lancedb-vector"]
lancedb-vector = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema"]
# Retained as a no-op alias for backward compatibility: older build scripts
# and packaging invoked `--features zorai-daemon/jemalloc`. On Linux the
# allocator is now always active (see target-specific dependency below); on
# other platforms the feature remains a harmless no-op.
jemalloc = []

[[bin]]
name = "zorai-daemon"
path = "src/main.rs"

[dependencies]
zorai-protocol = { workspace = true }
zorai-shared = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
portable-pty = "0.8"
strip-ansi-escapes = "0.2"
regex = "1"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-rusqlite = "0.6"
libsql = "0.9"
sha2 = "0.10"
sysinfo = "0.30"
tree-sitter = "0.22"
tree-sitter-bash = "0.21"
shlex = "1.3"
walkdir = "2"
base64 = "0.22"
reqwest = { workspace = true }
tokio-stream = { workspace = true }
humantime = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
which = "7"
jsonrepair = "0.1.0"
serde_yaml = "0.9.34"
notify = "6"
notify-debouncer-mini = { workspace = true }
croner = "3"
chrono = "0.4"
jsonschema = "0.45"
semver = "1"
prost = { workspace = true }
url = "2"
handlebars = "6.4"
percent-encoding = "2"
aes-gcm = "0.10.3"
rand = "0.8"
ring = "0.17"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest"] }
wa-rs = "0.2.0"
wa-rs-sqlite-storage = "0.2.0"
wa-rs-tokio-transport = "0.2.0"
wa-rs-ureq-http = "0.2.0"
async-trait = "0.1.89"
qrcode = "0.14"
ureq = { version = "3", features = ["json"] }
lancedb = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
interprocess = { version = "2", features = ["tokio"] }

[target.'cfg(unix)'.dependencies]
tokio = { workspace = true, features = ["net"] }

# jemalloc is unconditionally enabled on Linux builds (including production
# builds via GitHub Actions, which use plain `cargo build --release`). The
# glibc default allocator creates one arena per thread; with 30+ tokio workers
# and 14 per-connection rusqlite threads this produced ~13 arenas and >13 GB
# of retained/fragmented RSS after hours of multi-thread load (2026-08-30
# investigation). jemalloc still kept one 64 MiB dirty extent per arena while
# idle (about 5 GB at 89 threads) until narenas and background decay were set
# in src/main.rs. tikv-jemallocator cannot be built on MSVC, hence the
# target-specific gate; macOS and Windows keep their platform allocators.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.6"
